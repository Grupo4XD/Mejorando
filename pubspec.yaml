name: rockify
description: "Secure collaborative Spotify rooms."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  dio: ^5.9.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  flutter_secure_storage: ^10.0.0
  flutter_web_auth_2: ^5.0.0
  go_router: ^17.3.0
  google_fonts: ^8.1.0
  socket_io_client: ^3.1.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/imagenes/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/imagenes/logo_app.png" # La ruta a tu nuevo logo
