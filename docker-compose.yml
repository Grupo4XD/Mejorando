services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rockify
      POSTGRES_PASSWORD: rockify
      POSTGRES_DB: rockify
    ports:
      - "5432:5432"
    volumes:
      - rockify_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rockify -d rockify"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  rockify_postgres:
